spring.application.name=mentalhealth

#热部署生效
spring.devtools.restart.enabled=true
#设置重启目录
spring.devtools.restart.additional-paths=src/main/java
#设置classpath目录下的WEB-INF文件夹内容修改不重启
spring.devtools.restart.exclude=static/**

server.port=8088

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/mentalhealth?characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

mybatis.type-aliases-package=com.liu.mentalhealth.entity
mybatis.mapper-locations=classpath:mapper/*.xml

#是否开启文件上传支持，默认是true
spring.servlet.multipart.enabled=true
#文件写入磁盘的阈值，默认是0
spring.servlet.multipart.file-size-threshold=0
#单个文件的最大值，默认是50MB
spring.servlet.multipart.max-file-size=50MB
#多个文件上传时的总大小 值，默认是100MB
spring.servlet.multipart.max-request-size=100MB
#是否延迟解析，默认是false
spring.servlet.multipart.resolve-lazily=false


